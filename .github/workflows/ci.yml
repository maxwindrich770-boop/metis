name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate source and native build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm exec tsc --noEmit --pretty false

      - name: Run release and updater contract tests
        run: pnpm exec tsx --test tests/release-manifest.test.ts tests/github-releases.test.ts

      - name: Test remote client startup and device routing
        run: pnpm exec tsx --test tests/remote-client-startup.test.mjs tests/device-routing.test.ts

      - name: Test Apple backend contracts
        run: node --import tsx --test tests/mobile-apple.test.ts tests/chat-submit-worker.test.ts tests/run-event-stream.test.ts

      - name: Run local release contract test
        run: pnpm test:release

      - name: Check shell installers
        run: |
          set -euo pipefail
          for file in install/*.sh public/install/*.sh; do
            bash -n "$file"
          done

      - name: Build application
        run: pnpm build

  apple:
    name: Build Apple clients and exercise the Swift API
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build iPhone, Watch and Share Extension
        run: |
          xcodebuild -project clients/apple/MetisApple.xcodeproj -scheme Metis \
            -configuration Debug -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO -quiet build
      - name: Test authenticated chat flows against isolated Metis handlers
        run: |
          set -euo pipefail
          swiftc -D DEBUG clients/apple/MetisiOS/MetisAPI.swift clients/apple/Tests/Smoke.swift -o "$RUNNER_TEMP/metis-apple-smoke"
          node --import tsx clients/apple/Tests/fixture-server.ts &
          fixture_pid=$!
          trap 'if [[ -n "$fixture_pid" ]]; then kill "$fixture_pid" 2>/dev/null || true; fi' EXIT
          wait_for_fixture() {
            for attempt in {1..30}; do
              kill -0 "$fixture_pid" 2>/dev/null || return 1
              if curl --silent --output /dev/null http://localhost:43100/api/chats; then return 0; fi
              sleep 1
            done
            return 1
          }
          wait_for_fixture
          "$RUNNER_TEMP/metis-apple-smoke"
          # Smoke tests mutate the seed. Give UI tests a new temporary database.
          kill "$fixture_pid"
          wait "$fixture_pid" || true
          fixture_pid=""
          node --import tsx clients/apple/Tests/fixture-server.ts &
          fixture_pid=$!
          wait_for_fixture
          device="$(xcrun simctl list devices available --json | node -e '
            const fs = require("node:fs");
            const runtimes = Object.entries(JSON.parse(fs.readFileSync(0, "utf8")).devices).reverse();
            const phone = runtimes.flatMap(([, devices]) => devices).find(device => device.isAvailable && device.name.startsWith("iPhone"));
            if (!phone) process.exit(1);
            process.stdout.write(phone.udid);
          ')"
          xcodebuild -project clients/apple/MetisApple.xcodeproj -scheme Metis \
            -destination "id=$device" -parallel-testing-enabled NO -quiet test
